name: Finish validation upload

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finish-validation-upload.yml'

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and verify artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p examples/results examples
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, json

          root = Path('._upload')
          abelian_names = [
              'abelian.r00a.b64', 'abelian.r00b.b64', 'abelian.r00c.b64',
              'abelian.01.b64', 'abelian.02.b64', 'abelian.03.b64', 'abelian.04.b64',
              'abelian.r05a.b64', 'abelian.r05b.b64',
          ]
          encoded = ''.join((root / n).read_text() for n in abelian_names)
          raw = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha1(raw).hexdigest() == '07cad71a50de95c81b5338596b79dbe804bccf6c'
          Path('examples/results/abelian_class_field_checks.json').write_bytes(raw)
          a = json.loads(raw)
          assert len(a) == 530
          assert all(x.get('status') == 'ok' for x in a)

          cert_names = ['cert.00.b64', 'cert.01.b64']
          encoded = ''.join((root / n).read_text() for n in cert_names)
          raw = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha1(raw).hexdigest() == '4eabc41d873e5e6bc36f5952a19b2f1c1d939504'
          Path('examples/CERT_example_C4.json').write_bytes(raw)
          c = json.loads(raw)
          assert c.get('format') == 'artin-CERT-1'
          PY
      - name: Commit artifacts and clean staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ._upload
          rm -f .github/workflows/finish-validation-upload.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add validation and certificate examples'
          git push
