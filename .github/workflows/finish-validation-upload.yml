name: Finish validation upload

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finish-validation-upload.yml'

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and verify artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p examples/results examples
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, json

          def reconstruct(prefix, target, expected_sha1, repair=None):
              chunks = [p.read_text() for p in sorted(Path('._upload').glob(prefix + '*.b64'))]
              if repair is not None:
                  index, char = repair
                  chunks[-1] = chunks[-1][:index] + char + chunks[-1][index:]
              encoded = ''.join(chunks)
              raw = gzip.decompress(base64.b64decode(encoded, validate=True))
              assert hashlib.sha1(raw).hexdigest() == expected_sha1
              Path(target).write_bytes(raw)
              return json.loads(raw)

          a = reconstruct(
              'abelian.',
              'examples/results/abelian_class_field_checks.json',
              '07cad71a50de95c81b5338596b79dbe804bccf6c',
              repair=(3250, 'U'),
          )
          c = reconstruct(
              'cert.',
              'examples/CERT_example_C4.json',
              '4eabc41d873e5e6bc36f5952a19b2f1c1d939504',
          )
          assert len(a) == 530
          assert all(x.get('status') == 'ok' for x in a)
          assert c.get('format') == 'artin-CERT-1'
          PY
      - name: Commit artifacts and clean staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ._upload
          rm -f .github/workflows/finish-validation-upload.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add validation and certificate examples'
          git push
