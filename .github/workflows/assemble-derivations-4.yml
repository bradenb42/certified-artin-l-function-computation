name: Assemble derivations 4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/assemble-derivations-4.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct exact derivation pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          specs = {
              'tame-root-numbers.md': ('fa79ebf6f48f7eabfcb4ced7d6335a734af29167', 'c0fa6d8394ebd609ce1a99921b66b4d777474576'),
              'wild-root-numbers.md': ('18b057c3499c788696615a4f6fc56adc654b98ab', 'be6378efde4cc5b572336fc39f4d5d24e253bf98'),
              'global-root-numbers.md': ('9c457c156420f6340d31ae31b7ba4c63c92684bd', '6ee98e94e811cdb36e8743ae5269d6add233e321'),
              'functional-equation.md': ('c526940a0c91972e3e4b646f1208cbf48da8e154', '12ca44b1fbc99ba2434e68bb6aaf1df00cd0297c'),
          }
          stage = Path('.stage/theory4')
          outdir = Path('docs/theory')
          outdir.mkdir(parents=True, exist_ok=True)

          for name, (raw_sha1, git_sha) in specs.items():
              parts = sorted(stage.glob(name + '.part*'), key=lambda p: int(p.name.rsplit('part', 1)[1]))
              if len(parts) != 2:
                  raise SystemExit(f'{name}: expected 2 parts, got {len(parts)}')
              b64 = ''.join(p.read_text() for p in parts)
              raw = gzip.decompress(base64.b64decode(b64, validate=True))
              got_raw = hashlib.sha1(raw).hexdigest()
              got_git = hashlib.sha1(f'blob {len(raw)}\0'.encode() + raw).hexdigest()
              if got_raw != raw_sha1 or got_git != git_sha:
                  raise SystemExit(f'{name}: checksum mismatch raw={got_raw} git={got_git}')
              (outdir / name).write_bytes(raw)
              print(name, len(raw), got_git)
          PY
      - name: Commit pages and remove temporary assembly files
        shell: bash
        run: |
          rm -rf .stage/theory4
          rm -f .github/workflows/assemble-derivations-4.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add root-number and analytic derivations'
          git push origin HEAD:main
