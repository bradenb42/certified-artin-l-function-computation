name: Assemble final derivations

on:
  push:
    paths:
      - '.github/workflows/assemble-derivations-5.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct, verify, and edit derivations
        shell: bash
        run: |
          set -euo pipefail

          cat ._stage/theory5/subfield-zeta.*.b64 | base64 -d > docs/theory/subfield-zeta.md
          cat ._stage/theory5/certificate.00.b64 ._stage/theory5/certificate.01a.b64 ._stage/theory5/certificate.01b.b64 ._stage/theory5/certificate.02.b64 ._stage/theory5/certificate.03.b64 ._stage/theory5/certificate.04.b64 | base64 -d > docs/theory/certificate.md
          cat ._stage/theory5/verifier.*.b64 | base64 -d > docs/theory/verifier.md
          cat ._stage/theory5/cost.00.b64 ._stage/theory5/cost.01.b64 ._stage/theory5/cost.02a.b64 ._stage/theory5/cost.02b.b64 ._stage/theory5/cost.03.b64 | base64 -d > docs/theory/cost.md

          echo "subfield $(git hash-object docs/theory/subfield-zeta.md)"
          echo "certificate $(git hash-object docs/theory/certificate.md)"
          echo "verifier $(git hash-object docs/theory/verifier.md)"
          echo "cost $(git hash-object docs/theory/cost.md)"
          test "$(git hash-object docs/theory/subfield-zeta.md)" = "8f589e72bc33650d1b98385ad7ac38ac60c2bf29"
          test "$(git hash-object docs/theory/certificate.md)" = "8d0fe90e60b7b6a8fb85d5751c296bfbf926cee9"
          test "$(git hash-object docs/theory/verifier.md)" = "520db8e3d5aea79ee24ecd01472eb9fb103fd8a7"
          test "$(git hash-object docs/theory/cost.md)" = "672fcaabaa9376dca7433805747782954a883171"
          echo "Uploaded derivation sources verified exactly before prose edits."

          python - <<'PY'
          from pathlib import Path
          import re

          boilerplate = re.compile(
              r'^\*One of the derivations behind\* \[\*artin\*\]\(https://claude\.ai/README\.md\)\*; the\* '
              r'\[\*index\*\]\(https://claude\.ai/chat/README\.md\) \*lists them all and names the code that implements each\.\*\n\n',
              re.M,
          )
          replacements = {
              '**The check, as run.**': '**Verification.**',
              'the hard condition': 'the identity',
              'cheap blocks: resolvents mod': 'resolvent blocks: resolvents mod',
              'the price is paid in P3': 'the cost shifts to P3',
              "Reading the table for the project's target": "For the project's target",
              'unless $\\mathfrak{f}_{\\max}$ is enormous': 'unless $\\mathfrak{f}_{\\max}$ is sufficiently large',
              'are capped by falling back to the light mode': 'are capped by using the light mode',
              'at the price of the weaker guarantee stated there': 'with the weaker guarantee stated there',
              'simpler, the certificate records': 'alternatively, the certificate records',
          }
          for path in sorted(Path('docs/theory').glob('*.md')):
              if path.name == 'README.md':
                  continue
              text = path.read_text(encoding='utf-8')
              text = boilerplate.sub('', text, count=1)
              text = re.sub(
                  r'^The intended phrase "errors that cancel in a single functional equation but not across the multiplicities".*?\n\n',
                  '', text, flags=re.M | re.S,
              )
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

          echo "Remaining style-word candidates (for review):"
          grep -RniE 'One of the derivations behind|intended phrase|cheap blocks|the hard condition|the price is paid|enormous|obvious|of course|fortunately|unfortunately|naive|naïve|brute[- ]force|elegant|miracle|surprising|crude|ugly|wasteful|self-deprecat|pretentious|theatrical' docs/theory/*.md || true
          if grep -Rni 'One of the derivations behind' docs/theory/*.md; then exit 1; fi
          if grep -RniE 'intended phrase|cheap blocks|the hard condition|the price is paid|enormous|falling back to the light mode|at the price of the weaker guarantee' docs/theory/*.md; then exit 1; fi

          rm -rf ._stage/theory5
          rm -f .github/workflows/assemble-derivations-5.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs/theory ._stage .github/workflows/assemble-derivations-5.yml
          git commit -m 'Add final derivations and tighten theory prose'
          git push origin main
