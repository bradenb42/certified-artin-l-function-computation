name: Add Artin arithmetic modules

on:
  push:
    paths:
      - '.github/workflows/add-artin-arithmetic.yml'

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and verify source files
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, zlib
          from pathlib import Path

          ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'

          def decode_checked(encoded, expected):
              raw = gzip.decompress(base64.b64decode(encoded, validate=True))
              if hashlib.sha1(raw).hexdigest() != expected:
                  raise ValueError('SHA-1 mismatch')
              return raw

          def repair_one_missing_char(encoded, expected):
              try:
                  return decode_checked(encoded, expected)
              except Exception:
                  pass
              padded = encoded + '=' * ((-len(encoded)) % 4)
              compressed = base64.b64decode(padded, validate=False)
              dec = zlib.decompressobj(16 + zlib.MAX_WBITS)
              fail = None
              for i, b in enumerate(compressed):
                  try:
                      dec.decompress(bytes([b]))
                  except zlib.error:
                      fail = i
                      break
              approx = len(encoded) - 2000 if fail is None else (fail * 4) // 3
              positions = list(range(max(0, approx - 512), min(len(encoded) + 1, approx + 513)))
              positions += list(range(max(0, len(encoded) - 2500), len(encoded) + 1))
              seen = set()
              for pos in positions:
                  if pos in seen:
                      continue
                  seen.add(pos)
                  for ch in ALPHABET:
                      candidate = encoded[:pos] + ch + encoded[pos:]
                      try:
                          raw = decode_checked(candidate, expected)
                      except Exception:
                          continue
                      print(f'repaired missing base64 character at {pos}: {ch}')
                      return raw
              raise RuntimeError('could not repair staged base64 stream')

          specs = {
              'artin/ramified.py': ('._upload/ramified.py.gz.b64', '4e0f5b38a27fe966c523b75556ca2bc26e769c61', True),
              'artin/padic.py': ('._upload/padic.py.gz.b64', '2d3d33976700430d5dbe7f6d1c0b5fe84d214659', False),
          }
          for dst, (src, expected, repair) in specs.items():
              encoded = Path(src).read_text()
              raw = repair_one_missing_char(encoded, expected) if repair else decode_checked(encoded, expected)
              Path(dst).write_bytes(raw)
              compile(raw, dst, 'exec')
              print(dst, len(raw), hashlib.sha1(raw).hexdigest())
          PY
      - name: Commit source and clean staging
        shell: bash
        run: |
          rm -rf ._upload
          rm -f .github/workflows/add-artin-arithmetic.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add ramification and p-adic arithmetic modules'
          git push
