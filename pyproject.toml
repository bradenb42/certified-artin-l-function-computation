[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "artin"
version = "0.1.0"
description = "Artin L-functions from a polynomial, with checkable certificates"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["sympy>=1.12", "mpmath>=1.3", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["artin", "artinverify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
